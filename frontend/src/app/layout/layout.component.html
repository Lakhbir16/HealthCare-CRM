<div class="app-layout" [class.sidebar-mini]="sidebarCollapsed">
  <!-- Left Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">
        <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" class="medical-logo">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
          <path d="M12 9v4"></path>
          <path d="M10 11h4"></path>
        </svg>
      </div>
      <div class="brand-text" *ngIf="!sidebarCollapsed">
        <span class="app-title">HealthCRM</span>
        <span class="active-role-tag">{{ activeRole }}</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li *ngFor="let item of visibleNavItems">
          <a [routerLink]="item.route" routerLinkActive="active" class="nav-link" [title]="item.label">
            <span class="icon">
              <!-- Dashboard -->
              <svg *ngIf="item.icon === 'dashboard'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              <!-- Users / Patients -->
              <svg *ngIf="item.icon === 'users'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <!-- Calendar / Appointments -->
              <svg *ngIf="item.icon === 'calendar'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <!-- Pill / Prescriptions -->
              <svg *ngIf="item.icon === 'pill'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path>
                <path d="m8.5 8.5 7 7"></path>
              </svg>
              <!-- Flask / Laboratory -->
              <svg *ngIf="item.icon === 'flask'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 2v7.31L4.75 18.1a2 2 0 0 0 1.71 2.9h11.08a2 2 0 0 0 1.71-2.9L14 9.31V2"></path>
                <line x1="8.5" y1="2" x2="15.5" y2="2"></line>
                <line x1="14" y1="9.31" x2="10" y2="9.31"></line>
              </svg>
              <!-- Credit Card / Billing -->
              <svg *ngIf="item.icon === 'credit-card'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line>
              </svg>
              <!-- Shield / User Management -->
              <svg *ngIf="item.icon === 'shield'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
              <!-- File-Text / Audit -->
              <svg *ngIf="item.icon === 'file-text'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              <!-- Mail / Dev Mailbox -->
              <svg *ngIf="item.icon === 'mail'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <span class="label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer" *ngIf="!sidebarCollapsed">
      <div class="user-brief">
        <div class="user-avatar-small">{{ initials }}</div>
        <div class="user-meta">
          <span class="name">{{ currentUser?.fullName || 'User' }}</span>
          <span class="role">{{ activeRole }}</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-wrapper">
    <!-- Top Navigation Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn toggle-btn" (click)="toggleSidebar()" title="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="clinic-indicator">
          <span class="clinic-dot"></span>
          <span class="clinic-name">Metropolitan Medical Pavilion</span>
        </div>
      </div>

      <div class="topbar-right">
        <!-- ROLE SWITCHER DROPDOWN (Requirement 4) -->
        <div class="role-switcher-box" *ngIf="assignedRoles.length > 0">
          <span class="switcher-label">Active Role:</span>
          <div class="select-wrapper">
            <select [ngModel]="activeRole" (ngModelChange)="onRoleChange($event)" class="role-select">
              <option *ngFor="let r of assignedRoles" [value]="r">
                {{ r }}
              </option>
            </select>
            <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <!-- Dev Mailbox shortcut -->
        <a routerLink="/dev-mailbox" target="_blank" class="dev-mail-pill" title="Open Simulated Email Inbox for OTPs">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span>Dev Mailbox</span>
        </a>

        <!-- User Profile & Logout -->
        <div class="user-menu-wrapper">
          <button class="profile-avatar-btn" (click)="showProfileMenu = !showProfileMenu">
            <span class="avatar-initials">{{ initials }}</span>
            <span class="user-display-name">{{ currentUser?.firstName }}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div *ngIf="showProfileMenu" class="dropdown-menu">
            <div class="dropdown-header">
              <span class="dropdown-name">{{ currentUser?.fullName }}</span>
              <span class="dropdown-email">{{ currentUser?.email }}</span>
              <span class="dropdown-badge">{{ activeRole }}</span>
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-roles-list">
              <span class="roles-title">Assigned Roles:</span>
              <div class="role-tags">
                <span *ngFor="let r of assignedRoles" class="role-tag" [class.is-active]="r === activeRole">
                  {{ r }}
                </span>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-item" (click)="logout()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Router View for Pages -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
