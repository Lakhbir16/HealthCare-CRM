<div class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="medical-cross">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
          <path d="M12 9v4"></path>
          <path d="M10 11h4"></path>
        </svg>
      </div>
      <h2>US Healthcare CRM</h2>
      <p class="subtitle">Clinical & Practice Management System</p>
    </div>

    <!-- Quick Role Fill Pills for Fast Testing -->
    <div class="quick-demo-roles">
      <span class="quick-label">Quick Test Login:</span>
      <div class="pills-row">
        <button type="button" class="pill" (click)="quickFill('admin')">Admin</button>
        <button type="button" class="pill" (click)="quickFill('doctor')">Doctor</button>
        <button type="button" class="pill" (click)="quickFill('nurse')">Nurse</button>
        <button type="button" class="pill" (click)="quickFill('receptionist')">Receptionist</button>
        <button type="button" class="pill" (click)="quickFill('patient')">Patient</button>
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Work / Patient Email Address</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="e.g. doctor.smith@healthcare.com"
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
        </div>
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="field-error">
          A valid email address is required.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Enter password"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <button type="button" class="eye-toggle" (click)="togglePassword()">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="field-error">
          Password is required.
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-container">
          <input type="checkbox" formControlName="rememberMe" />
          <span class="checkmark"></span>
          Remember me
        </label>
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary submit-btn" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        <span *ngIf="!isLoading">Sign In</span>
      </button>
    </form>

    <div class="login-footer">
      <div class="hipaa-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>HIPAA Compliant &amp; 256-Bit Encrypted Healthcare CRM</span>
      </div>
      <div class="dev-inbox-link">
        <a routerLink="/dev-mailbox" target="_blank">Simulated Dev Mailbox (for OTPs) &rarr;</a>
      </div>
    </div>
  </div>
</div>
